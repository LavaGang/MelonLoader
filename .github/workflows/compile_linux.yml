on:
  workflow_call:
    inputs:
      VERSION:
        required: true
        type: string
      SKIP_DEBUG:
        required: true
        type: boolean

jobs:
  compile_linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          sudo dpkg --add-architecture i386
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Debug for linux-x64
        if: inputs.SKIP_DEBUG != true
        run: dotnet build --no-restore -c Debug -p:Platform="x64" -p:ForceRID="linux-x64" -p:Version="${{ inputs.VERSION }}"

      - name: Upload Debug for linux-x64
        if: inputs.SKIP_DEBUG != true
        uses: actions/upload-artifact@v7
        with:
          name: MelonLoader.Linux.x64.CI.Debug
          path: Output/Debug/linux-x64

      - name: Build Release for linux-x64
        run: dotnet build --no-restore -c Release -p:Platform="x64" -p:ForceRID="linux-x64" -p:Version="${{ inputs.VERSION }}"

      - name: Upload Release for linux-x64
        uses: actions/upload-artifact@v7
        with:
          name: MelonLoader.Linux.x64.CI.Release
          path: Output/Release/linux-x64

      - name: Build Debug for linux-arm64
        if: inputs.SKIP_DEBUG != true
        run: dotnet build --no-restore -c Debug -p:Platform="arm64" -p:ForceRID="linux-arm64" -p:Version="${{ inputs.VERSION }}"

      - name: Upload Debug for linux-arm64
        if: inputs.SKIP_DEBUG != true
        uses: actions/upload-artifact@v7
        with:
          name: MelonLoader.Linux.arm64.CI.Debug
          path: Output/Debug/linux-arm64

      - name: Build Release for linux-arm64
        run: dotnet build --no-restore -c Release -p:Platform="arm64" -p:ForceRID="linux-arm64" -p:Version="${{ inputs.VERSION }}"

      - name: Upload Release for linux-arm64
        uses: actions/upload-artifact@v7
        with:
          name: MelonLoader.Linux.arm64.CI.Release
          path: Output/Release/linux-arm64
